name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # js/{sim,gf-neuron,cx-circuit,brain*}.{js,d.ts} + bench.js are vendored from
      # fruitflyworld/sim and /bench — fingerprints must match vendor.lock.json.
      - run: node scripts/sync-vendor.mjs check
      - run: npm run check
